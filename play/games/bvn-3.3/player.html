<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BVN 3.3 MOD</title>
  <style>
    html,body { margin:0; background:#000; color:#fff; font:14px sans-serif; }
    #msg { position:fixed; left:0; right:0; top:8px; text-align:center; z-index:9; }
    ruffle-player { width:800px; height:600px; display:block; margin:40px auto 0; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      preferredRenderer: "canvas",
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: true,
      letterbox: "on",
      warnOnUnsupportedContent: true
    };
  </script>
  <script src="../../vendor/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="msg">加载修改版 SWF…</div>
  <script>
    window.addEventListener('load', () => {
      const p = window.RufflePlayer.newest().createPlayer();
      document.body.appendChild(p);
      const msg = document.getElementById('msg');
      p.addEventListener('loadedmetadata', () => { msg.textContent = 'metadata ok'; });
      p.addEventListener('loadeddata', () => { msg.textContent = 'loaded'; });
      p.load('main-mod.swf').then(() => {
        msg.textContent = 'load() resolved  ready=' + p.readyState;
      }).catch(e => { msg.textContent = 'LOAD FAIL ' + e; });
    });
  </script>
</body>
</html>
